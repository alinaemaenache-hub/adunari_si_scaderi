<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1530">
<title>Lumea Sofiei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
:root{
  color-scheme:dark;
  --bg:#0F1530; --bg2:#151D3F; --panel:#1A2348; --panel2:#222D5A; --line:#2F3B72; --text:#EEF1FF; --muted:#98A3D4;
  --mag:#FF4FA3; --magD:#C92F7B; --teal:#22D3C5; --tealD:#139C91; --gold:#FFC23D; --goldD:#C98E0C; --violet:#8B7BFF; --bad:#FF6B7A;
  --r:18px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#2A2170 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#0E3B52 0%,transparent 60%),var(--bg);background-color:var(--bg);background-attachment:fixed;color:var(--text);font-family:"Rubik",system-ui,sans-serif;font-size:17px;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
h1,h2,h3{font-weight:800;margin:0;line-height:1.1;text-wrap:balance;letter-spacing:-.01em}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:14px 40px}
.screen{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.center{text-align:center}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{font-weight:800;font-size:19px;padding:13px 20px;border-radius:14px;background:var(--mag);color:#fff;box-shadow:0 4px 0 var(--magD);transition:transform .08s;letter-spacing:.01em}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--magD)}
.btn.big{font-size:22px;padding:16px 22px;width:100%}
.btn.teal{background:var(--teal);color:#062A2A;box-shadow:0 4px 0 var(--tealD)}
.btn.gold{background:var(--gold);color:#2B1D00;box-shadow:0 4px 0 var(--goldD)}
.btn.ghost{background:var(--panel2);color:var(--text);box-shadow:0 4px 0 #111833;border:1px solid var(--line)}
.btn.small{font-size:15px;padding:9px 13px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:14px}

/* home: player card */
.player{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center;padding:14px}
.avframe{border-radius:16px;overflow:hidden;aspect-ratio:200/280;position:relative}
.avframe svg{width:100%;height:100%;display:block}
.lvl{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lvl .n{font-size:15px;font-weight:800;color:#2B1D00;background:var(--gold);padding:3px 10px;border-radius:8px}
.rank{font-weight:700;color:var(--gold)}
.xpbar{height:14px;background:#0E1430;border-radius:999px;overflow:hidden;border:1px solid var(--line);margin-top:10px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--mag));border-radius:999px;transition:width .8s ease}
.xptext{font-size:14px;font-weight:700;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.duo{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.streak{display:flex;align-items:center;gap:12px}
.streak .big{font-size:40px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.streak>svg{width:44px;height:44px}
.week{display:flex;gap:6px;margin-top:12px}
.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted)}
.wd i{width:100%;max-width:30px;height:8px;border-radius:4px;background:#0E1430;border:1px solid var(--line)}
.wd.on i{background:var(--gold);border-color:var(--gold)}
.wd.today span{color:var(--text)}
.badgeprev{display:flex;flex-direction:column;justify-content:space-between;gap:8px;color:var(--text)}
.badgeprev .icons{display:flex;gap:4px;flex-wrap:wrap}
.badgeprev .icons svg{width:34px;height:34px}
.mission .stg{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:11px 4px;border-top:1px solid var(--line);width:100%;text-align:left}
.mission .stg.first{border-top:0}
.stg .num{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:800;background:#0E1430;border:1px solid var(--line)}
.stg.done .num{background:#0E1430;border-color:var(--line);color:var(--teal)}
.stg.next .num{background:var(--mag);border-color:var(--mag)}
.stg .t{font-weight:700}
.stg .s{font-size:13px;color:var(--muted);font-weight:600}
.stg .st{font-size:14px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.stg.done .st{color:var(--teal)}
.stg.skip{opacity:.45}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gsec h3{font-size:20px;margin-bottom:10px}
.gbody{font-weight:500;line-height:1.55}
.gbody p{margin:0 0 8px}.gbody p:last-child{margin-bottom:0}
.gbody ol,.gbody ul{margin:0 0 8px;padding-left:22px}.gbody li{margin-bottom:4px}
.gbody td{border-bottom:1px solid var(--line)}
.gbody td:last-child{text-align:right;white-space:nowrap;color:var(--gold)}
.gvis{margin:0 0 12px;display:flex;flex-direction:column;align-items:stretch}
.gvis .vert,.tourvis .vert{font-size:36px}
.tourvis{display:flex;flex-direction:column;align-items:stretch;justify-content:center;min-height:120px;background:#0E1430;border:1px solid var(--line);border-radius:14px;padding:14px}
.tourvis .vert{margin:0 auto}
.gvis .streak{gap:8px}.gvis .streak svg{width:40px;height:40px}
.demo-steps{display:flex;gap:8px;justify-content:center}
.demo-steps .num{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:800;background:#0E1430;border:1px solid var(--line)}
.demo-steps .num.d{background:var(--teal);border-color:var(--teal);color:#062A2A}
.demo-steps .num.n{background:var(--mag);border-color:var(--mag)}
.vert.demo .gstep{position:relative}
.vert.demo .gstep::after{position:absolute;top:-10px;right:-8px;font-size:12px;font-weight:800;background:var(--gold);color:#2B1D00;border-radius:999px;width:18px;height:18px;display:grid;place-items:center;line-height:1}
.vert.demo .g1::after{content:"1"}.vert.demo .g2::after{content:"2"}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--teal);width:22px;border-radius:4px}
.nav .btn{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:15px;padding:12px 6px}
.nav svg{width:26px;height:26px}

/* practice */
.ptop{display:flex;align-items:center;gap:8px}
.timer{flex:1;height:32px;border-radius:10px;background:#0E1430;border:1px solid var(--line);position:relative;overflow:hidden}
.timer .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--tealD),var(--teal));transition:width .25s linear}
.timer.warn .fill{background:linear-gradient(90deg,var(--goldD),var(--gold))}
.timer.over .fill{background:repeating-linear-gradient(45deg,#5B4BD6,#5B4BD6 10px,#6D5EF0 10px,#6D5EF0 20px);width:100%!important}
.timer .lbl{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.track{position:relative;height:44px;background:#0E1430;border:1px solid var(--line);border-radius:12px}
.track .line{position:absolute;left:22px;right:22px;top:50%;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 14px)}
.track .mk{position:absolute;top:50%;width:36px;height:36px;margin:-18px 0 0 -18px;transition:left .3s ease}
.track .mk.me{border-radius:50%;overflow:hidden;background:var(--panel2);border:2px solid var(--mag)}
.track .mk.me svg{width:100%;height:100%}
.track .mk.ghost{display:grid;place-items:center}
.track .flag{position:absolute;right:6px;top:50%;margin-top:-12px;width:24px;height:24px}
.pace{font-weight:700;font-size:14px;text-align:center;min-height:18px;color:var(--muted)}
.pace.ahead{color:var(--gold)}.pace.mid{color:#C9D2E8}.pace.behind{color:#FF9A7A}
.medalbig{display:flex;align-items:center;justify-content:center;gap:12px;text-align:left}
.qcard{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:22px;padding:18px 12px;text-align:center;min-height:170px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.qnum{font-weight:700;color:var(--muted);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.eq{font-weight:800;font-size:clamp(44px,12vw,74px);line-height:1.1;display:flex;justify-content:center;align-items:center;gap:.22em;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.slot{min-width:1.4em;padding:0 .15em;border-radius:14px;background:#0E1430;border:3px dashed var(--violet);line-height:1.15}
.slot.filled{border-style:solid}
.slot.good{border-color:var(--teal);color:var(--teal)}
.slot.bad{border-color:var(--bad);color:var(--bad)}
.vert{display:inline-grid;gap:6px;align-items:center;font-weight:800;font-size:clamp(40px,11vw,64px);line-height:1.1;font-variant-numeric:tabular-nums;margin:0 auto}
.vert .op{padding-right:.15em;text-align:center;min-width:.6em;color:var(--muted)}
.vert .cell{width:.95em;height:1.2em;display:grid;place-items:center}
.vert .bar{grid-column:1/-1;height:4px;background:var(--text);border-radius:2px;margin:2px 0}
.vert .cell.u{background:#0E1430;border:3px dashed var(--violet);border-radius:10px}
.vert .cell.u.next{border:3px solid var(--mag);animation:blink 1s infinite}
@keyframes blink{50%{border-color:#6B2A55}}
.urow{display:contents}
.urow.good .cell.u{border:3px solid var(--teal);color:var(--teal);animation:none}
.urow.bad .cell.u{border:3px solid var(--bad);color:var(--bad);animation:none}
.vert .mark{width:.95em;height:.62em;border:2px dashed #475492;border-radius:8px;background:transparent;display:grid;place-items:center;padding:0;font-size:inherit;color:var(--gold)}
.vert .mark span{font-size:.5em;line-height:1;font-weight:800}
.vert .mark.on{border-style:solid;border-color:var(--gold);background:rgba(255,194,61,.12)}
.note{font-weight:600;font-size:14px;color:var(--muted);line-height:1.45}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.msg{font-weight:800;font-size:20px;min-height:26px}
.msg.good{color:var(--teal)}.msg.bad{color:var(--bad)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:420px;width:100%;margin:0 auto}
.pad button{font-weight:800;font-size:30px;height:62px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);box-shadow:0 4px 0 #0B1028;font-variant-numeric:tabular-nums}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #0B1028}
.pad .ok{background:var(--teal);color:#062A2A;border-color:var(--teal);box-shadow:0 4px 0 var(--tealD)}
.pad .del{color:var(--mag)}
.choices{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.choices button{width:96px;height:80px;border-radius:16px;font-weight:800;font-size:38px;background:var(--panel2);border:2px solid var(--line);box-shadow:0 4px 0 #0B1028;font-variant-numeric:tabular-nums}
.coach{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:8px;pointer-events:none;z-index:5}
.coach .face{width:56px;height:56px;border-radius:50%;overflow:hidden;background:var(--panel2);border:2px solid var(--mag)}
.coach .face svg{width:100%;height:100%}
.bubble{background:var(--text);color:var(--bg);border-radius:14px 14px 14px 4px;padding:9px 13px;font-weight:800;font-size:16px;max-width:230px;transform-origin:left bottom;transition:transform .2s,opacity .2s}
.bubble.hide{transform:scale(.3);opacity:0}
.problem{font-size:clamp(19px,4.4vw,23px);line-height:1.55;text-align:left;font-weight:500;max-width:62ch;margin:0 auto}
.answerbox{font-weight:800;font-size:44px;min-width:3.6em;display:inline-block}
.term{font-weight:800;text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:2px;text-underline-offset:4px}
.termref{display:grid;gap:4px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,194,61,.3);font-weight:600}
.hint{background:rgba(255,194,61,.12);border:1px solid rgba(255,194,61,.4);color:#FFE3A3;border-radius:12px;padding:11px 13px;text-align:left;font-weight:600}

/* overlays & result */
.overlay{position:fixed;inset:0;background:rgba(5,8,22,.7);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:22px;padding:22px;max-width:460px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px}
.xpbig{font-size:56px;font-weight:900;line-height:1;background:linear-gradient(90deg,var(--violet),var(--mag));-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.stat{display:grid;grid-template-columns:1fr auto;gap:8px 16px;text-align:left;font-weight:600}
.stat b{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.stat .xp{color:var(--gold)}
.price{display:inline-flex;align-items:center;gap:6px}

/* wardrobe & badges */
.wardrobe{display:grid;grid-template-columns:minmax(0,220px) 1fr;gap:16px;align-items:start}
.avframe.sticky{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));z-index:2;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.opts{display:flex;gap:9px;flex-wrap:wrap}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.sw.sel{box-shadow:0 0 0 3px var(--teal)}
.opt{padding:9px 13px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.opt.sel{background:var(--violet);border-color:var(--violet);color:#fff}
.opt.locked{opacity:.5}
.opt svg{width:14px;height:14px}
label.f{font-weight:700;display:block;margin-bottom:8px;font-size:13px;color:var(--muted);letter-spacing:.1em}
input.txt{font:inherit;font-weight:700;font-size:18px;padding:10px 13px;border-radius:12px;border:1px solid var(--line);width:100%;max-width:280px;color:var(--text);background:#0E1430}
input.num{font:inherit;font-weight:800;font-size:17px;width:76px;padding:7px 8px;border-radius:10px;border:1px solid var(--line);color:var(--text);background:#0E1430;text-align:center}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.badge svg{width:64px;height:64px}
.badge.off svg{filter:grayscale(1);opacity:.3}
.badge b{font-size:15px}
.badge span{font-size:13px;color:var(--muted);font-weight:500;line-height:1.35}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tblwrap{overflow-x:auto}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
@media (max-width:560px){
  .player{grid-template-columns:96px 1fr}
  .duo{grid-template-columns:1fr}
  .wardrobe{grid-template-columns:104px 1fr;gap:10px}
  .wardrobe .panel{padding:12px}
  .sw{width:36px;height:36px}
  .pad button{height:56px;font-size:27px}
  .coach .face{width:46px;height:46px}.bubble{font-size:14px;max-width:190px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="coach" id="coach" hidden><div class="face" id="coachFace"></div><div class="bubble hide" id="bubble"></div></div>
<canvas class="confetti" id="confetti" hidden></canvas>

function levelInfo(xp){let L=1,need=200,rest=xp||0;while(rest>=need){rest-=need;L++;need=200+75*(L-1);}return{level:L,into:rest,need};}
const MEDALS={3:{name:"Aur",c:"#FFC23D",xp:15},2:{name:"Argint",c:"#C9D2E8",xp:8},1:{name:"Bronz",c:"#D98A4E",xp:3}};
const GOLD_T=.7, SILVER_T=.9;
function medalOf(stage,firstTry,correct,tot,t,lim,hint){
  const r=t/lim, acc=firstTry/tot;
  if(stage===5){if(firstTry===tot&&!hint&&r<=.6)return 3;if(correct===tot&&r<=1)return 2;return 1;}
  if(acc>=.9&&r<=GOLD_T)return 3;if(acc>=.8&&r<=SILVER_T)return 2;return 1;
}

function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=(n>>8&255)+amt,b=(n&255)+amt;r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}

  ()=>{const F=R(40,400),s=R(30,500);if(F+s>999)return null;return{t:`${TW("Descăzutul")} este ${F+s}, iar ${TW("diferența")} este ${F}. Cât este ${TW("scăzătorul")}?`,a:s,h:"Scăzătorul = descăzutul − diferența."};},
  ()=>{const s=R(30,450),F=R(40,450);if(s+F>999)return null;return{t:`${TW("Scăzătorul")} este ${s}, iar ${TW("diferența")} este ${F}. Cât este ${TW("descăzutul")}?`,a:s+F,h:"Descăzutul = scăzătorul + diferența."};},
  ()=>{const x=R(120,450),y=R(60,400),z=R(50,x+y-10);if(x+y>999)return null;return{t:`${TW("Descăzutul")} este suma numerelor ${x} și ${y}, iar ${TW("scăzătorul")} este ${z}. Cât este ${TW("diferența")}?`,a:x+y-z,h:`Află întâi descăzutul: ${x} + ${y}. Apoi scade scăzătorul.`};},
  ()=>{const D=R(200,900),d=R(15,150);return{t:`${TW("Descăzutul")} este ${D}, iar ${TW("scăzătorul")} este cu ${d} mai mic decât ${TW("descăzutul")}. Cât este ${TW("diferența")}?`,a:d,h:"Diferența arată cu cât este mai mare descăzutul decât scăzătorul."};},
  ()=>{const k=R(2,3),b=R(2,k===2?5:3),a=R(2,10);return{t:`Primul ${TW("factor")} este ${a}, iar al doilea ${TW("factor")} este ${k===2?"dublul":"triplul"} lui ${b}. Cât este ${TW("produsul")}?`,a:a*k*b,h:`Al doilea factor: ${b} × ${k}. Apoi înmulțește factorii.`};},
  ()=>{const n=R(3,10);return{t:`Află ${TW("produsul")} dintre cel mai mare număr de o cifră și numărul ${n}.`,a:9*n,h:"Cel mai mare număr de o cifră este 9."};},
  ()=>{const a=R(3,10),b=R(3,10);return{t:`${TW("Produsul")} a doi ${TW("factori")} este ${a*b}. Unul dintre ${TW("factori")} este ${a}. Care este celălalt ${TW("factor")}?`,a:b,h:"Factorul necunoscut = produsul : factorul cunoscut."};},
  ()=>{const n=R(4,9);return{t:`Un ${TW("factor")} este cel mai mic număr de două cifre, iar celălalt ${TW("factor")} este ${n}. Cât este ${TW("produsul")}?`,a:10*n,h:"Cel mai mic număr de două cifre este 10."};},
  ()=>{const q=R(3,10),c=R(3,9),N=q*c,x=R(Math.max(1,N-40),N-1);return{t:`${TW("Deîmpărțitul")} este suma numerelor ${x} și ${N-x}, iar ${TW("împărțitorul")} este ${c}. Cât este ${TW("câtul")}?`,a:q,h:`Află întâi deîmpărțitul: ${x} + ${N-x}. Apoi împarte la împărțitor.`};},
  ()=>{const q=R(4,10),d=R(3,9);return{t:`Dacă ${TW("câtul")} este ${q} și ${TW("împărțitorul")} este ${d}, află ${TW("deîmpărțitul")}.`,a:q*d,h:"Deîmpărțitul = câtul × împărțitorul."};},
  ()=>{const q=R(3,9),d=R(3,9);return{t:`${TW("Deîmpărțitul")} este ${q*d}, iar ${TW("câtul")} este ${q}. Care este ${TW("împărțitorul")}?`,a:d,h:"Împărțitorul = deîmpărțitul : câtul."};},
  ()=>{const k=R(2,9),m=R(3,10),N=k*m;if(N<12)return null;const x=R(Math.ceil(N/3),N-2);return{t:`Află numărul de ${k} ori mai mic decât suma numerelor ${x} și ${N-x}.`,a:m,h:`Suma: ${x} + ${N-x}. „De ${k} ori mai mic” înseamnă împărțire la ${k}.`};},
  ()=>{const a=R(4,10),b=R(4,10),d=R(2,9),q=R(2,9);if(a*b<q)return null;return{t:`Află ${TW("diferența")} dintre ${TW("produsul")} numerelor ${a} și ${b} și ${TW("câtul")} numerelor ${q*d} și ${d}.`,a:a*b-q,h:`Calculează întâi produsul (${a} × ${b}) și câtul (${q*d} : ${d}), apoi scade.`};},
  ()=>{const a=R(3,10),b=R(3,10),d=R(2,9),q=R(2,10);return{t:`Adună ${TW("produsul")} numerelor ${a} și ${b} cu ${TW("câtul")} numerelor ${q*d} și ${d}.`,a:a*b+q,h:`Produsul: ${a} × ${b}. Câtul: ${q*d} : ${d}. Apoi adună.`};},
  ()=>{const S=R(200,999),a=R(60,S-40);return{t:`${TW("Suma")} a doi ${TW("termeni")} este ${S}. Unul dintre ${TW("termeni")} este ${a}. Care este celălalt ${TW("termen")}?`,a:S-a,h:"Termenul necunoscut = suma − termenul cunoscut."};},
  ()=>{const a=R(3,10),b=R(3,10),c=R(20,300);return{t:`${TW("Scăzătorul")} este ${TW("produsul")} numerelor ${a} și ${b}, iar ${TW("diferența")} este ${c}. Află ${TW("descăzutul")}.`,a:a*b+c,h:`Scăzătorul: ${a} × ${b}. Descăzutul = scăzătorul + diferența.`};},
  ()=>{const q=R(2,10),y=R(10,80),d=R(3,9);return{t:`${TW("Câtul")} este diferența numerelor ${y+q} și ${y}, iar ${TW("împărțitorul")} este ${d}. Află ${TW("deîmpărțitul")}.`,a:q*d,h:`Câtul: ${y+q} − ${y}. Deîmpărțitul = câtul × împărțitorul.`};}
];
function genTerm(){for(let g=0;g<100;g++){const r=TERM_T[R(0,TERM_T.length-1)]();if(r&&r.a>=0)return{problem:true,term:true,idx:-1,text:r.t,answer:r.a,unit:"",hint:r.h+TERM_REF,mode:"pad"};}return{problem:true,term:true,idx:-1,text:`${TW("Descăzutul")} este 210, iar ${TW("diferența")} este 85. Cât este ${TW("scăzătorul")}?`,answer:125,unit:"",hint:"Scăzătorul = descăzutul − diferența."+TERM_REF,mode:"pad"};}
function genS5(k){return Array.from({length:k},(_,i)=>{const g=S.problemIdx+i;if(g%2===1)return genTerm();const idx=Math.floor(g/2)%PROBLEMS.length;const pr=PROBLEMS[idx];return{problem:true,idx,text:pr.t,answer:pr.a,unit:pr.u,hint:pr.h,mode:"pad"};});}
const GEN={1:genS1,2:genS2,3:genS3,4:genS4,5:genS5};

/* ---------- routing ---------- */
const app=document.getElementById("app");
let P=null, screen="home", draft=null;
function route(){
  stopTimer();
  document.getElementById("coach").hidden=true;
  if(!S.profile.created)screen="wardrobe";
  ({wardrobe:renderWardrobe,home:renderHome,badges:renderBadges,parent:renderParent,guide:renderGuide}[screen]||renderHome)();
  window.scrollTo(0,0);
}
function go(s){screen=s;P=null;draft=null;route();}

/* ---------- home ---------- */
function renderHome(){
  const t=today(),rec=S.days[t]||{stages:{}},streak=liveStreak(),C=cfg(),req=n=>C[n].c>0;
  let next=1;while(next<=5&&((rec.stages&&rec.stages[next])||!req(next)))next++;
  const done=next>5, L=levelInfo(S.xp);
  let week="";for(let i=6;i>=0;i--){const k=addDays(t,-i);const on=S.days[k]&&S.days[k].done;const [y,m,d]=k.split("-").map(Number);const w=new Date(y,m-1,d).getDay();
    week+=`<div class="wd ${on?"on":""} ${i===0?"today":""}"><i></i><span>${i===0?"Azi":DOW[w]}</span></div>`;}
  let rows="";for(let n=1;n<=5;n++){const r=rec.stages&&rec.stages[n];const skip=!r&&!req(n);const cls=(r?"done":skip?"skip":n===next?"next":"")+(n===1?" first":"");
    const meta=skip?"Liber azi":`${n===5?(C[n].c===1?"1 problemă":C[n].c+" probleme"):C[n].c+" exerciții"} · ${fmt(C[n].m*60)}`;
    const status=r?`${fmt(r.t)}<br>+${r.xp||0} XP`:n===next?"Urmează":skip?"":"Blocat";
    rows+=`<button class="stg ${cls}" data-stage="${n}" ${(!r&&n!==next)?"disabled":""}><span class="num">${r?(r.medal?medalSVG(r.medal,28):"✓"):n}</span><span><div class="t">${STAGE[n].name}</div><div class="s">${meta}</div></span><span class="st">${status}</span></button>`;}
  const shortDay=S.settings&&S.settings.today&&S.settings.today.date===t;
  const recent=S.badges.slice(-5).map(id=>BADGES.find(b=>b.id===id)).filter(Boolean);
  app.innerHTML=`<section class="screen">
    <div class="panel player">
      <div class="avframe">${avatarFull(S.profile)}</div>
      <div>
        <div class="eyebrow">Jucătoare</div>
        <h1 style="font-size:28px;margin:4px 0 8px">${esc(S.profile.name)}</h1>
        <div class="lvl"><span class="n">Nivel ${L.level}</span><span class="rank">${rankOf(L.level)}</span></div>
        <div class="xpbar"><i style="width:${Math.round(L.into/L.need*100)}%"></i></div>
        <div class="xptext">${L.into} / ${L.need} XP până la nivelul ${L.level+1}</div>
      </div>
    </div>
    <div class="duo">
      <div class="panel">
        <div class="streak">${streak>0?I.flame:I.flameOff}<div><div class="big">${streak}</div><div class="muted" style="font-weight:700;font-size:14px">${streak===1?"zi la rând":"zile la rând"}</div></div>
          ${S.shields?`<span class="chip" style="margin-left:auto" title="Scuturi">${I.shield} ${S.shields}</span>`:""}</div>
        <div class="week">${week}</div>
        <p class="muted" style="margin:10px 0 0;font-size:14px;font-weight:600">${streakLine(streak,done)}</p>
      </div>
      <button class="panel badgeprev" id="toBadges" style="text-align:left">
        <div class="eyebrow">Insigne</div>
        <div style="font-size:30px;font-weight:900">${S.badges.length}<span class="muted" style="font-size:16px;font-weight:700"> / ${BADGES.length}</span></div>
        <div class="icons">${recent.length?recent.map(b=>hexBadge(b.c,b.g)).join(""):`<span class="muted" style="font-size:14px;font-weight:600">Prima insignă te așteaptă.</span>`}</div>
      </button>
    </div>
    <div class="panel mission">
      <div class="row" style="margin-bottom:6px"><div class="grow"><div class="eyebrow">Misiunea de azi</div>${shortDay?`<div style="font-size:13px;font-weight:700;color:var(--gold);margin-top:4px">Azi antrenamentul e mai scurt</div>`:""}</div><span class="muted" style="font-weight:700;font-size:14px">${done?"Completă":`Etapa ${next} din 5`}</span></div>
      ${rows}
      <div style="margin-top:12px">${done?`<p style="margin:0;font-weight:700">Misiune completă pe azi. Revino mâine ca să crească seria.</p><p class="muted" style="margin:6px 0 0;font-size:14px">Poți rejuca orice etapă ca să-ți bați recordul.</p>`
        :`<button class="btn big" id="startBtn">${Object.keys(rec.stages||{}).length===0?"Începe misiunea":"Continuă: etapa "+next}</button>`}</div>
    </div>
    <div class="nav">
      <button class="btn ghost" id="toWard">${I.shirt}Vestiar</button>
      <button class="btn ghost" id="toBadges2">${I.medal}Insigne</button>

  const sb=document.getElementById("startBtn");if(sb)sb.onclick=()=>intro(next);

  document.getElementById("toWard").onclick=()=>go("wardrobe");
  document.getElementById("toBadges").onclick=document.getElementById("toBadges2").onclick=()=>go("badges");
  document.getElementById("toParent").onclick=parentGate;
  document.getElementById("toGuide").onclick=()=>go("guide");
  if(!S.seenTour&&!document.querySelector(".overlay"))setTimeout(()=>showTour(0),300);
}
function streakLine(s,done){
  if(s===0)return "Termină misiunea de azi ca să pornești seria.";
  if(!done&&S.streak.lastDay!==today())return "Termină misiunea de azi ca să nu pierzi seria.";
  const left=7-(s%7);return left===7?"Săptămână completă! Ai primit un scut.":`Încă ${left} ${left===1?"zi":"zile"} până la scutul săptămânii.`;
}

/* ---------- wardrobe ---------- */

    <div class="wardrobe">
      <div class="avframe sticky" id="pv">${avatarFull(c)}</div>

function resume(){P.paused=false;P.last=performance.now();P.lastAct=performance.now();}
const vW=it=>Math.max(...[0,2,4].map(i=>String(it.parts[i]).length));
function vertHTML(it){
  const W=vW(it);
  const row=(sign,val,isU)=>{let c=`<span class="op">${sign}</span>`;
    if(isU){let cells="";for(let i=0;i<W;i++)cells+=`<span class="cell u"></span>`;return c+`<span class="urow" id="slot">${cells}</span>`;}
    const str=String(val).padStart(W," ");for(let i=0;i<W;i++)c+=`<span class="cell">${str[i]===" "?"":str[i]}</span>`;return c;};
  let marks=`<span class="op"></span>`;for(let i=0;i<W;i++)marks+=`<button class="mark" data-m="${i}" aria-label="Marchează coloana ${i+1}"><span></span></button>`;
  return `<div class="vert" style="grid-template-columns:auto repeat(${W},auto)">${marks}${row("",it.parts[0],it.u===0)}${row(it.parts[1],it.parts[2],it.u===2)}<div class="bar"></div>${row("",it.parts[4],it.u===4)}</div>`;
}
function showQuestion(){
  const it=P.items[P.idx];P.input="";P.tries=0;P.locked=false;
  const q=document.getElementById("qcard");
  if(it.problem){
    q.innerHTML=`<div class="qnum">${P.items.length>1?`Problema ${P.idx+1} din ${P.items.length}`:"Problema zilei"}</div><p class="problem">${it.text}</p><div id="hintBox"></div>

    document.getElementById("hintBtn").onclick=()=>{P.hintShown=true;document.getElementById("hintBox").innerHTML=`<div class="hint">${it.hint}</div>`;document.getElementById("hintBtn").hidden=true;act();};
  } else if(it.vertical){
    q.innerHTML=`<div class="qnum">Exercițiul ${P.idx+1} din ${P.items.length}</div>${vertHTML(it)}<div class="note">Scrie de la dreapta: întâi unitățile.<br>${it.parts[1]==="−"?"Atinge căsuța de sus când te împrumuți.":"Atinge căsuța de sus când ai 1 în minte."}</div>`;
    q.querySelectorAll(".mark").forEach(m=>m.onclick=()=>{const on=m.classList.toggle("on");m.firstChild.textContent=on?(it.parts[1]==="−"?"•":"1"):"";m.setAttribute("aria-pressed",on);act();});
  } else {
    q.innerHTML=`<div class="qnum">Exercițiul ${P.idx+1} din ${P.items.length}</div><div class="eq">${it.parts.map((x,i)=>i===it.u?`<span class="slot" id="slot">?</span>`:`<span>${x}</span>`).join("")}</div>`;
  }
  if(it.vertical)setSlot("");
  const ia=document.getElementById("inputArea");
  if(it.mode==="choice"){
    ia.innerHTML=`<div class="choices">${it.options.map(v=>`<button data-c="${v}">${v}</button>`).join("")}</div>`;
    ia.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{if(P.locked)return;setSlot(b.dataset.c);submit(b.dataset.c,b);});
  } else {
    ia.innerHTML=`<div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-d="${d}">${d}</button>`).join("")}<button class="del" data-del aria-label="Șterge">⌫</button><button data-d="0">0</button><button class="ok" data-ok>OK</button></div>`;
    ia.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>typeD(b.dataset.d));
    ia.querySelector("[data-del]").onclick=delD;
    ia.querySelector("[data-ok]").onclick=()=>{if(P.locked||!P.input)return;submit(P.input);};
  }
  const m=document.getElementById("msg");m.textContent="";m.className="msg center";
  updateTrack();
}
function typeD(d){if(P.locked)return;const it=P.items[P.idx];
  if(it.vertical){if(P.input.length>=vW(it))return;P.input=d+P.input;}
  else{if(P.input.length>=4)return;if(P.input==="0")P.input="";P.input+=d;}
  setSlot(P.input);act();}
function delD(){if(P.locked)return;const it=P.items[P.idx];P.input=it.vertical?P.input.slice(1):P.input.slice(0,-1);setSlot(P.input);act();}
function act(){P.lastAct=performance.now();hideSay();}
function setSlot(v){const s=document.getElementById("slot");if(!s)return;
  if(P.items[P.idx].vertical){const cells=[...s.querySelectorAll(".cell")],W=cells.length;cells.forEach((c,i)=>{const j=W-1-i;c.textContent=j<v.length?v[v.length-1-j]:"";c.classList.toggle("next",v.length<W&&i===W-1-v.length);});s.classList.remove("good","bad");return;}
  s.textContent=v===""?(P.items[P.idx].problem?" ":"?"):v;s.classList.toggle("filled",v!=="");s.classList.remove("good","bad");}
document.addEventListener("keydown",e=>{
  if(screen!=="practice"||!P||P.paused||P.done||document.querySelector(".overlay"))return;
  const it=P.items[P.idx];if(!it)return;
  if(/^[0-9]$/.test(e.key)){if(it.mode==="choice"){const b=[...document.querySelectorAll("[data-c]")].find(x=>x.dataset.c===e.key);if(b)b.click();}else typeD(e.key);e.preventDefault();}
  else if(e.key==="Backspace"&&it.mode!=="choice"){delD();e.preventDefault();}
  else if(e.key==="Enter"&&it.mode!=="choice"&&P.input&&!P.locked){submit(P.input);e.preventDefault();}
});
function submit(val,btn){
  const it=P.items[P.idx];act();P.locked=true;
  const s=document.getElementById("slot"),m=document.getElementById("msg");
  const maxTries=it.problem?3:2;
  if(Number(val)===it.answer){
    P.correct++;
    if(P.tries===0){P.firstTry++;P.combo++;P.maxCombo=Math.max(P.maxCombo,P.combo);}
    if(it.borrow)P.borrowOk++;
    const st=P.stage;P.xp+=st<=2?(P.tries===0?1:0):st<=4?(P.tries===0?2:0):([15,6,2][P.tries]||0);
    s.classList.add("good");m.className="msg center good";
    m.textContent=P.combo>0&&P.combo%5===0?`${P.combo} la rând!`:GOOD[R(0,GOOD.length-1)];
    beep("good");if(P.combo>0&&P.combo%10===0)say(P.combo+" la rând! +3 XP",1500);
    setTimeout(nextQ,it.problem?900:420);
  } else {
    P.tries++;P.combo=0;beep("bad");s.classList.add("bad");
    const target=btn||(it.vertical?document.querySelector(".vert"):s);target.classList.remove("shake");void target.offsetWidth;target.classList.add("shake");
    if(P.tries>=maxTries){
      m.className="msg center bad";m.textContent=`Răspunsul corect: ${it.answer}`;
      setSlot(String(it.answer));s.classList.remove("bad");s.classList.add("good");
      P.missed.push(it.problem?(it.term?"Termeni: "+it.text.replace(/<[^>]+>/g,"").slice(0,70)+"… ["+it.answer+"]":"Problema "+(it.idx+1)+": ["+it.answer+"]"):eqText(it));
      setTimeout(nextQ,1900);
    } else {
      m.className="msg center bad";m.textContent=it.problem?(P.tries===1?"Nu încă. Verifică fiecare pas.":"Mai ai o încercare. Citește din nou întrebarea."):"Mai încearcă o dată.";
      setTimeout(()=>{P.input="";setSlot("");target.classList.remove("shake");P.locked=false;},600);
    }
  }
}
function eqText(it){return it.parts.map((x,i)=>i===it.u?`[${x}]`:x).join(" ");}
function nextQ(){P.idx++;if(P.idx>=P.items.length){finishStage();return;}showQuestion();}

/* timer */
let TI=null;
function startTimer(){stopTimer();P.last=performance.now();TI=setInterval(tick,200);tick();}
function stopTimer(){if(TI){clearInterval(TI);TI=null;}}
function tick(){
  if(!P||P.done)return;const now=performance.now();
  if(!P.paused)P.elapsed+=(now-P.last)/1000;
  P.last=now;
  const lim=P.limit,left=lim-P.elapsed,tm=document.getElementById("timer");if(!tm)return;
  const f=document.getElementById("tfill"),l=document.getElementById("tlbl");
  if(left>=0){f.style.width=(left/lim*100)+"%";l.textContent=fmt(left);tm.classList.toggle("warn",left<lim*.25);tm.classList.remove("over");}
  else{tm.classList.add("over");l.textContent="Timp în plus +"+fmt(-left);}
  if(!P.paused&&now-P.lastAct>15000){P.lastAct=now;say(CHEERS[R(0,CHEERS.length-1)].replace("Sofia",S.profile.name),3000);beep("nudge");}
  const it=P.items[P.idx];if(it&&it.problem&&P.elapsed>60){const hb=document.getElementById("hintBtn");if(hb&&hb.disabled){hb.disabled=false;hb.textContent="Arată un indiciu";}}
  updateTrack();
}
function updateTrack(){
  const me=document.getElementById("mkMe"),gh=document.getElementById("mkGhost"),pc=document.getElementById("pace");if(!me)return;
  const tr=me.parentElement.clientWidth-44,my=P.idx/P.items.length,gold=Math.min(1,P.elapsed/(P.limit*GOLD_T)),silver=P.elapsed/(P.limit*SILVER_T);
  me.style.left=(22+my*tr)+"px";gh.style.left=(22+gold*tr)+"px";
  if(P.elapsed<3){pc.className="pace";pc.textContent="Ceasul auriu merge în ritm de aur. Îl întreci?";}
  else if(P.elapsed>P.limit){pc.className="pace behind";pc.textContent="Timpul a trecut. Termină calm, fiecare răspuns contează.";}
  else if(my>=gold){pc.className="pace ahead";pc.textContent="Ritm de aur! Ține-o tot așa!";}
  else if(my>=silver){pc.className="pace mid";pc.textContent="Ritm de argint. Mai repede pentru aur!";}
  else{pc.className="pace behind";pc.textContent="Accelerează ca să prinzi o medalie mai bună!";}
}
let sayT=null;
function say(t,ms){const b=document.getElementById("bubble");b.textContent=t;b.classList.remove("hide");clearTimeout(sayT);sayT=setTimeout(hideSay,ms||2500);}
function hideSay(){document.getElementById("bubble").classList.add("hide");}

/* finish */
function finishStage(){
  stopTimer();P.done=true;
  const n=P.stage,tot=P.items.length,lim=P.limit,t=Math.round(P.elapsed),inTime=t<=lim;
  const prevBest=S.best[n],L0=levelInfo(S.xp).level;
  const record=n<5&&P.isDef&&P.correct===tot&&P.firstTry>=tot*.7&&(prevBest==null||t<prevBest);
  const combos=Math.floor(P.maxCombo/10);
  const medal=medalOf(n,P.firstTry,P.correct,tot,t,lim,P.hintShown);
  const lines=[];let xp;
  if(P.replay){xp=Math.round(P.xp/2);lines.push(["Etapă rejucată (½ XP)",xp]);}
  else{
    xp=P.xp;lines.push([n===5?"Probleme rezolvate":"Răspunsuri corecte din prima",P.xp]);
    xp+=MEDALS[medal].xp;lines.push(["Medalie de "+MEDALS[medal].name.toLowerCase(),MEDALS[medal].xp]);
    if(record&&prevBest!=null){xp+=10;lines.push(["Record nou",10]);}
    if(combos){xp+=3*combos;lines.push(["Serii de 10 la rând",3*combos]);}
  }
  if(record){S.best[n]=t;if(prevBest!=null)S.stats.records++;}
  if(!P.replay&&medal===3)S.stats.gold++;
  if(n===1&&P.isDef&&t<=75&&P.firstTry>=23)S.stats.fast++;
  S.stats.borrow+=P.borrowOk;if(n===5){S.stats.problems+=P.correct;S.stats.problemsFirst+=P.firstTry;}
  const rec=todayRec();
  if(!P.replay||!rec.stages[n])rec.stages[n]={c:P.firstTry,ok:P.correct,n:tot,t,lim,xp,medal,missed:P.missed.slice(0,12),hint:n===5?P.hintShown:undefined};
  if(n===5&&!P.replay)S.problemIdx+=tot;
  const C=cfg();
  let dayReward=null;
  if([1,2,3,4,5].every(k=>rec.stages[k]||C[k].c===0)&&!rec.done){rec.done=true;dayReward=completeDay(rec);xp+=dayReward.xp;lines.push(["Misiunea zilei completă",dayReward.xp]);}
  S.xp+=xp;
  const badges=newBadges();
  const L1=levelInfo(S.xp);
  save();
  document.getElementById("coach").hidden=true;
  let next=n+1;while(next<=5&&(rec.stages[next]||C[next].c===0))next++;if(next>5)next=null;
  beep("win");
  app.innerHTML=`<section class="screen"><div class="panel screen center" style="gap:14px;padding:24px 18px">
    <div class="eyebrow">Etapa ${n} · ${STAGE[n].name}</div>
    <div class="medalbig">${medalSVG(medal,76)}<div><div class="eyebrow">Medalie</div><div style="font-size:26px;font-weight:900;color:${MEDALS[medal].c}">${MEDALS[medal].name}</div></div></div>
    <div class="xpbig">+${xp} XP</div>
    <div class="stat" style="max-width:380px;margin:0 auto;width:100%">
      <span>${n===5?"Rezolvate":"Corecte din prima"}</span><b>${n===5?P.correct+" / "+tot:P.firstTry+" / "+tot}</b>
      <span>Timp</span><b>${fmt(t)} <span class="muted" style="font-weight:600">/ ${fmt(lim)}</span></b>
      ${n<5?`<span>Record</span><b>${S.best[n]!=null?fmt(S.best[n]):"–"}</b>`:""}
      ${lines.map(([l,v])=>`<span class="muted">${l}</span><b class="xp">+${v}</b>`).join("")}
    </div>
    <div style="max-width:380px;margin:0 auto;width:100%;text-align:left">
      <div class="row" style="justify-content:space-between;font-weight:700;font-size:14px"><span>Nivel ${L1.level} · ${rankOf(L1.level)}</span><span class="muted">${L1.into} / ${L1.need} XP</span></div>
      <div class="xpbar"><i style="width:${Math.round(L1.into/L1.need*100)}%"></i></div>
    </div>
    ${record?`<p style="margin:0;font-weight:800;color:var(--teal)">${prevBest==null?"Primul tău record la această etapă!":"Record nou! Mai rapidă ca data trecută."}</p>`:""}
    ${medal<3?`<p class="muted" style="margin:0;font-weight:600;font-size:15px">${nextMedalTip(n,medal,tot,lim)}</p>`:`<p style="margin:0;font-weight:700;color:var(--gold)">Aur! Ai lucrat rapid și corect.</p>`}
    <div class="row" style="justify-content:center">
      ${next&&!P.replay&&!dayReward?`<button class="btn big teal" id="nextSt">Etapa ${next}</button>`:""}
      <button class="btn ghost" id="home">Acasă</button>
    </div></div></section>`;
  const ns=document.getElementById("nextSt");if(ns)ns.onclick=()=>{P=null;intro(next);};
  document.getElementById("home").onclick=()=>go("home");
  const queue=[];
  if(L1.level>L0)queue.push(()=>levelUpModal(L0,L1.level));
  badges.forEach(b=>queue.push(()=>badgeModal(b)));
  if(dayReward)queue.push(()=>dayModal(dayReward));
  runQueue(queue);
  if(medal===3||record||L1.level>L0)confetti();
}
let Q=[];
function runQueue(q){Q=q;nextModal();}
function nextModal(){const f=Q.shift();if(f)setTimeout(f,350);}
function levelUpModal(from,to){
  const unl=[...OUTFITS,...ACCS,...BGS].filter(i=>i.lvl>from&&i.lvl<=to);
  beep("win");
  modal(`<div class="eyebrow">Nivel nou</div><div class="xpbig" style="font-size:72px">${to}</div><h2>${rankOf(to)}</h2>
    ${unl.length?`<p style="margin:0;font-weight:600">Ai deblocat: ${unl.map(i=>`<b>${i.name}</b>`).join(", ")}</p>`:`<p class="muted" style="margin:0">La nivelurile următoare te așteaptă obiecte noi.</p>`}
    <div class="row" style="justify-content:center">${unl.length?`<button class="btn teal" id="toW">Mergi la vestiar</button>`:""}<button class="btn ghost" id="ok1">Continuă</button></div>`,true);
  document.getElementById("ok1").onclick=()=>{closeModal();nextModal();};
  const w=document.getElementById("toW");if(w)w.onclick=()=>{closeModal();Q=[];go("wardrobe");};
}
function badgeModal(b){
  modal(`<div class="eyebrow">Insignă nouă</div><div style="width:110px;margin:0 auto">${hexBadge(b.c,b.g)}</div><h2>${b.name}</h2><p class="muted" style="margin:0">${b.desc}</p><button class="btn teal" id="ok2">Super</button>`,true);
  document.getElementById("ok2").onclick=()=>{closeModal();nextModal();};
}
function dayModal(r){
  modal(`<div class="eyebrow">Misiune completă</div><div style="width:84px;margin:0 auto">${I.flame}</div><h2 style="font-size:30px">${r.count} ${r.count===1?"zi":"zile"} la rând</h2>
    <p style="margin:0;font-weight:700;color:var(--gold)">+${r.xp} XP bonus</p>
    ${r.week?`<p style="margin:0;font-weight:600">Săptămână completă! Ai primit un scut: îți păstrează seria dacă ratezi o zi.</p>`:""}
    ${r.shield?`<p style="margin:0;font-weight:600">Ai folosit un scut ca să nu pierzi seria.</p>`:""}
    <button class="btn teal" id="ok3">Acasă</button>`,true);
  document.getElementById("ok3").onclick=()=>{closeModal();go("home");};
}
function nextMedalTip(n,m,tot,lim){
  if(n===5)return m===2?"Pentru aur: rezolvă din prima, fără indiciu, în cel mult "+fmt(lim*.6)+".":"Pentru argint: rezolvă corect în cel mult "+fmt(lim)+".";
  return m===2?`Pentru aur: minimum ${Math.ceil(tot*.9)} corecte din prima și cel mult ${fmt(lim*GOLD_T)}.`:`Pentru argint: minimum ${Math.ceil(tot*.8)} corecte din prima și cel mult ${fmt(lim*SILVER_T)}.`;
}
function completeDay(rec){
  const t=today(),st=S.streak;let usedShield=false;
  if(st.lastDay!==t){
    if(st.lastDay===addDays(t,-1))st.count++;
    else if(st.lastDay===addDays(t,-2)&&S.shields>0){S.shields--;st.count++;usedShield=true;}
    else st.count=1;
    st.lastDay=t;st.best=Math.max(st.best,st.count);
  }
  const fullDay=[1,2,3,4,5].every(k=>cfg()[k].c>=DEF_CFG[k].c);
  if(rec&&fullDay){const v=Object.values(rec.stages);if(v.length&&v.every(x=>x.medal===3))S.stats.goldDay++;if(v.length&&v.every(x=>x.c===x.n))S.stats.perfectDay++;}
  const r={xp:15,week:false,shield:usedShield,count:st.count};
  if(st.count%7===0){r.week=true;r.xp+=40;S.shields=Math.min(3,S.shields+1);}
  return r;
}

/* ---------- parent ---------- */
function parentGate(){
  modal(`<h2>Pentru părinți</h2><p style="margin:0" class="muted">Cât fac 12 × 7?</p><input class="txt" id="pg" inputmode="numeric" style="margin:0 auto;text-align:center" aria-label="Răspuns"><div class="msg bad" id="pgm"></div><div class="row" style="justify-content:center"><button class="btn ghost" data-close>Renunță</button><button class="btn teal" id="pgo">Intră</button></div>`);
  const i=document.getElementById("pg");i.focus();
  const ok=()=>{if(i.value.trim()==="84"){closeModal();go("parent");}else document.getElementById("pgm").textContent="Răspuns greșit.";};
  document.getElementById("pgo").onclick=ok;i.onkeydown=e=>{if(e.key==="Enter")ok();};
}
function renderParent(){
  const keys=Object.keys(S.days).sort().reverse().slice(0,21),L=levelInfo(S.xp);
  const cell=r=>r?`${r.c}/${r.n}<br><span class="muted">${fmt(r.t)}${r.t>r.lim?" ⏱":""}</span>`:"–";
  const missed=[];keys.slice(0,7).forEach(k=>{const d=S.days[k];Object.keys(d.stages||{}).forEach(s=>(d.stages[s].missed||[]).forEach(m=>missed.push(m)));});
  app.innerHTML=`<section class="screen">
    <div class="row"><div class="grow"><div class="eyebrow">Doar pentru adulți</div><h1 style="font-size:28px;margin-top:4px">Colțul părinților</h1></div><button class="btn ghost small" id="back">Înapoi</button></div>
    <div class="panel"><div class="stat">
      <span>Nivel</span><b>${L.level} (${S.xp} XP)</b>
      <span>Seria curentă / cea mai lungă</span><b>${liveStreak()} / ${S.streak.best} zile</b>
      <span>Scuturi disponibile</span><b>${S.shields}</b>
      <span>Probleme rezolvate corect</span><b>${S.stats.problems}</b>
      <span>Scăderi cu împrumut corecte</span><b>${S.stats.borrow}</b>
      ${[1,2,3,4].map(n=>`<span>Record etapa ${n} (${DEF_CFG[n].c} ex. / ${fmt(DEF_CFG[n].m*60)})</span><b>${S.best[n]!=null?fmt(S.best[n]):"–"}</b>`).join("")}
    </div></div>
    ${settingsCard()}
    <div class="panel"><h3 style="font-size:19px;margin-bottom:6px">Ultimele zile</h3>
      <p class="muted" style="margin:0 0 8px;font-size:13px">Corecte din prima / total, apoi timpul. ⏱ = a depășit timpul propus.</p>
      <div class="tblwrap"><table><thead><tr><th>Ziua</th><th>E1</th><th>E2</th><th>E3</th><th>E4</th><th>Probl.</th></tr></thead><tbody>
      ${keys.length?keys.map(k=>{const d=S.days[k],st=d.stages||{};return `<tr><td><b>${k.slice(8)}.${k.slice(5,7)}</b>${d.done?" ✓":""}</td>${[1,2,3,4,5].map(n=>`<td>${cell(st[n])}</td>`).join("")}</tr>`;}).join(""):`<tr><td colspan="6" class="muted">Încă nu există antrenamente.</td></tr>`}
      </tbody></table></div></div>
    <div class="panel"><h3 style="font-size:19px;margin-bottom:8px">Greșeli din ultimele 7 zile</h3>
      ${missed.length?`<div class="opts">${missed.slice(0,40).map(m=>`<span class="chip">${esc(m)}</span>`).join("")}</div><p class="muted" style="font-size:13px;margin:8px 0 0">Între paranteze: răspunsul corect.</p>`:`<p class="muted" style="margin:0">Nicio greșeală înregistrată.</p>`}
    </div>
    <div class="panel row"><div class="grow"><b>Bonus pentru teme</b><div class="muted" style="font-size:13px">Recompensă când își face bine temele.</div></div><button class="btn gold small" id="addxp">+20 XP</button></div>
    <div class="panel row"><div class="grow"><b>Resetează tot</b><div class="muted" style="font-size:13px">Șterge personajul, XP-ul, insignele și istoricul.</div></div><button class="btn ghost small" id="reset">Resetează</button></div>
  </section>`;
  document.getElementById("back").onclick=()=>go("home");
  bindSettings();
  document.getElementById("addxp").onclick=e=>{S.xp+=20;newBadges();save();e.currentTarget.textContent="Adăugat";setTimeout(renderParent,800);};
  document.getElementById("reset").onclick=()=>{modal(`<h2>Sigur resetezi?</h2><p style="margin:0" class="muted">Se pierd nivelul, insignele, seria și istoricul.</p><div class="row" style="justify-content:center"><button class="btn ghost" data-close>Nu</button><button class="btn" id="doReset">Da, resetează</button></div>`);
    document.getElementById("doReset").onclick=()=>{S=defaultState();save();closeModal();go("home");};};
}
function settingsCard(){
  const C=cfg(),st=S.settings||{},isToday=st.today&&st.today.date===today();
  return `<div class="panel"><h3 style="font-size:19px;margin-bottom:6px">Antrenamentul zilnic</h3>
    <p class="muted" style="margin:0 0 10px;font-size:13px;line-height:1.45">Pentru zilele cu multe teme poți micșora antrenamentul. Pune 0 ca să sari peste o etapă. Seria continuă dacă Sofia termină ce ai setat. Recordurile se numără doar cu valorile inițiale.</p>
    <div class="tblwrap"><table><thead><tr><th>Etapa</th><th>Exerciții</th><th>Minute</th></tr></thead><tbody>
    ${[1,2,3,4,5].map(n=>`<tr><td><b>${n}</b> ${STAGE[n].name}<br><span class="muted" style="font-size:12px">inițial: ${DEF_CFG[n].c} / ${DEF_CFG[n].m} min</span></td>
      <td><input class="num" type="number" inputmode="numeric" id="cfgc${n}" min="0" max="${MAXC[n]}" step="1" value="${C[n].c}" aria-label="Exerciții etapa ${n}"></td>
      <td><input class="num" type="number" inputmode="decimal" id="cfgm${n}" min="0.5" max="15" step="0.5" value="${C[n].m}" aria-label="Minute etapa ${n}"></td></tr>`).join("")}
    </tbody></table></div>
    <div class="row" style="margin-top:10px"><button class="btn ghost small" id="cfgBusy">Completează: zi aglomerată</button><button class="btn ghost small" id="cfgReset">Completează: valori inițiale</button></div>
    <div class="row" style="margin-top:10px"><button class="btn gold small" id="cfgToday">Aplică doar azi</button><button class="btn teal small" id="cfgDef">Salvează pentru fiecare zi</button></div>
    <p style="margin:10px 0 0;font-weight:700;font-size:14px" id="cfgMsg">${isToday?"Azi se folosesc setări doar pentru azi. Mâine revin cele obișnuite.":st.def?"Se folosesc setările tale obișnuite.":"Se folosesc valorile inițiale."}</p>
    ${isToday?`<button class="btn ghost small" id="cfgClearToday" style="margin-top:8px">Anulează setările de azi</button>`:""}
  </div>`;
}
function readCfg(){const o={};let any=false;for(let n=1;n<=5;n++){let c=parseInt(document.getElementById("cfgc"+n).value,10);let m=parseFloat(String(document.getElementById("cfgm"+n).value).replace(",","."));
  if(!isFinite(c))c=0;c=Math.max(0,Math.min(MAXC[n],c));if(!isFinite(m))m=DEF_CFG[n].m;m=Math.max(.5,Math.min(15,Math.round(m*2)/2));o[n]={c,m};if(c>0)any=true;}
  return any?o:null;}
function fillCfg(o){for(let n=1;n<=5;n++){document.getElementById("cfgc"+n).value=o[n].c;document.getElementById("cfgm"+n).value=o[n].m;}}
function checkDayAfterCfg(){const rec=S.days[today()];if(!rec||rec.done||!Object.keys(rec.stages||{}).length)return null;const C=cfg();if([1,2,3,4,5].every(k=>rec.stages[k]||C[k].c===0)){rec.done=true;const r=completeDay(rec);S.xp+=r.xp;newBadges();return r;}return null;}
function bindSettings(){
  const msg=t=>{document.getElementById("cfgMsg").textContent=t;};
  document.getElementById("cfgBusy").onclick=()=>fillCfg(BUSY_CFG);
  document.getElementById("cfgReset").onclick=()=>fillCfg(DEF_CFG);
  const apply=todayOnly=>{const o=readCfg();if(!o){msg("Lasă cel puțin o etapă cu exerciții.");return;}
    S.settings=S.settings||{};if(todayOnly)S.settings.today={date:today(),cfg:o};else{S.settings.def=o;S.settings.today=null;}
    const r=checkDayAfterCfg();save();renderParent();
    document.getElementById("cfgMsg").textContent=(todayOnly?"Salvat doar pentru azi.":"Salvat pentru fiecare zi.")+(r?" Sofia terminase deja etapele rămase, așa că misiunea s-a încheiat și seria a crescut.":"");};
  document.getElementById("cfgToday").onclick=()=>apply(true);
  document.getElementById("cfgDef").onclick=()=>apply(false);
  const ct=document.getElementById("cfgClearToday");if(ct)ct.onclick=()=>{S.settings.today=null;save();renderParent();};
}

/* ---------- modal & confetti ---------- */
function modal(html,noBackdropClose){closeModal();const o=document.createElement("div");o.className="overlay";o.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;document.body.appendChild(o);
  o.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal);if(!noBackdropClose)o.onclick=e=>{if(e.target===o)closeModal();};}
function closeModal(){document.querySelectorAll(".overlay").forEach(o=>o.remove());}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.getElementById("confetti");c.hidden=false;const x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#FF4FA3","#FFC23D","#22D3C5","#8B7BFF","#3F7BFF"];
  const ps=Array.from({length:90},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.4,vx:(Math.random()-.5)*2.4,vy:2.5+Math.random()*3,r:3+Math.random()*4,c:cols[R(0,4)],a:Math.random()*6}));
  let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.12;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/3,p.r*2,p.r*.66);x.restore();});
    if(++f<130)requestAnimationFrame(loop);else{x.clearRect(0,0,c.width,c.height);c.hidden=true;}})();
}

/* ---------- boot ---------- */
try{const raw=localStorage.getItem(KEY);if(raw)S=merge(JSON.parse(raw));}catch(e){}
route();
initDb();
})();
</script>
